<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Works</title>
    <link rel="icon" type="image/png" href="assets/images/Logo.png">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, 0)), url('assets/images/background.png');
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }

        html {
            scroll-behavior: smooth;
            background-color: #161616;
        }

        ::-webkit-scrollbar {
            width: 8px; 
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            border-radius: 20px;
            border: 2px solid #0a0a0a; 
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%); 
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 80px);
            max-width: 1300px;
            padding: 8px 24px;
            background: rgba(15, 15, 15, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50px;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            margin-left: 15px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: #ccc;
            text-decoration: none;
            transition: color 0.3s ease;
            font-size: 0.95rem;
        }

        .nav-links a:hover {
            color: #667eea;
        }

        .nav-cta {
            padding: 10px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 30px;
            color: #fff !important;
            font-weight: 500;
        }

        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }

        .menu-toggle span {
            width: 25px;
            height: 2px;
            background: #fff;
            transition: all 0.3s ease;
        }

        /* Header Section */
        .header-section {
            padding: 150px 60px 80px;
            max-width: 1400px;
            margin: 0 auto;
            text-align: center;
        }

        .header-section h1 {
            font-size: 5rem;
            font-weight: 700;
            margin-bottom: -5px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-section p {
            font-size: 1.1rem;
            color: #888;
            max-width: 600px;
            margin-bottom: 0px;
            margin: 0 auto -50px;
        }

        /* Filter Section */
        .filter-section {
            padding: 0 60px 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .filter-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 8px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            color: #888;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.90rem;
            font-family: inherit;
        }

        .filter-btn:hover, .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-color: transparent;
            transform: translateY(-2px);
        }

        /* Portfolio Grid */
        .portfolio-section {
            padding: 0 60px 100px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .portfolio-grid {
            display: block;
            width: 100%;
            padding: 0;
        }

        .grid-sizer { 
            width: 33.333%; 
        }

        .portfolio-item {
            position: relative;
            display: inline-block;
            width: 33.333%;
            margin-bottom: 0px;
            break-inside: avoid;
            border-radius: 10px;
            cursor: pointer;
            padding: 15px;
            box-shadow: 0.4s ease;
        }

        .portfolio-item-inner {
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .portfolio-item:hover .portfolio-item-inner {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.3);
            z-index: 2;
        }

        .portfolio-image {
            width: 100%;
            height: auto;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .portfolio-item:hover .portfolio-image {
            transform: scale(1.05);
        }

        .portfolio-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.9) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 30px;
        }

        .portfolio-item:hover .portfolio-overlay {
            opacity: 1;
        }

        .portfolio-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0px;
        }

        .portfolio-category {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 15px;
        }

        .portfolio-tags {
            display: flex;
            gap: 8px;
            margin-top: -10px;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(102, 126, 234, 0.15); 
            color: #667eea;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 200;
            padding: 40px;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .modal-content {
            max-width: 1200px;
            width: 100%;
            background: #1a1a1a;
            border-radius: 25px;
            padding: 60px;
            position: relative;
            margin: 80px auto;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            color: #888;
            cursor: pointer;
            transition: color 0.3s ease;
            background: rgba(0,0,0,0.5);
            border: none;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border-radius: 50%;
        }

        .close-modal:hover {
            color: #fff;
        }

        .modal-title {
            font-size: 2.5rem;
            margin-bottom: 0px;
        }

        .modal-category {
            color: #667eea;
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .modal-description {
            color: #aaa;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 40px;
            white-space: pre-line;
        }

        .modal-images-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .modal-images-container img {
            width: 100%;
            height: auto;
            border-radius: 5px;
            object-fit: contain;
        }

        .modal-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            padding-top: 40px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .info-item h4 {
            color: #667eea;
            font-size: 0.9rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-item p {
            color: #aaa;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 100px 20px;
            display: none;
        }

        .empty-state.show {
            display: block;
        }

        .empty-state i {
            font-size: 4rem;
            color: #333;
            margin-bottom: 20px;
        }

        .empty-state p {
            color: #666;
            font-size: 1.1rem;
        }

        @media (max-width: 1000px) {
            .grid-sizer, .portfolio-item { width: 50%; }
        }
        @media (max-width: 600px) {
            .grid-sizer, .portfolio-item { width: 100%; }
            .portfolio-section { padding: 0 20px 60px; }
        }

        /* Mobile */

        html {
            scrollbar-gutter: stable;
        }

        /* Footer */
        .footer {
            padding: 30px 40px;

        }

        .footer p {

        }

    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="nav-content">
            <a href="index.html" class="logo">Farhanul Hakim</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="design.html">Design</a>
                <a href="videography.html">Videography</a>
                <a href="photography.html">Photography</a>
                <a href="index.html#contact" class="nav-cta">Contact Me</a>
            </div>
            <div class="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <section class="header-section">
        <h1>DESIGN WORKS</h1>
        <p>A selection of Design works from various project types.</p>
    </section>

    <!-- Filter -->
    <section class="filter-section">
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All Projects</button>
            <button class="filter-btn" data-filter="Social Media">Social Media</button>
            <button class="filter-btn" data-filter="Poster">Poster</button>
            <button class="filter-btn" data-filter="Banner">Banner</button>
            <button class="filter-btn" data-filter="Book">Book</button>
        </div>
    </section>

    <!-- Portfolio Grid -->
    <section class="portfolio-section">
        <div class="portfolio-grid" id="portfolioGrid">
            <div class="loading-state" style="color: white; grid-column: 1/-1; text-align: center; padding: 50px;">
                <p>Loading...</p>
            </div>
        </div>

        <div class="empty-state" id="emptyState">
            <i class="fas fa-folder-open"></i>
            <p>Kosong Bos kek Hati</p>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Farhanul Studio</p>
    </footer>

    <!-- Modal -->
    <div class="modal" id="portfolioModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closePortfolioModal()">×</button>
            <h2 class="modal-title" id="mTitle">Project Title</h2>
            <p class="modal-category" id="mCategory">Category</p>
            <p class="modal-description" id="mDesc">-</p>
            
            <div class="modal-images-container" id="modalImagesContainer">
                <!-- Images akan dimuat di sini -->
            </div>

            <div class="modal-info">
                <div class="info-item">
                    <h4>Client</h4>
                    <p id="mClient">-</p>
                </div>
                <div class="info-item">
                    <h4>Year</h4>
                    <p id="mYear">-</p>
                </div>
                <div class="info-item">
                    <h4>Tools</h4>
                    <p id="mTools">-</p>
                </div>
            </div>
        </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCsi8-2A9thmiz_Uymt7bBZWaaErPy5_Cw",
            authDomain: "farhanul-studio.firebaseapp.com",
            projectId: "farhanul-studio",
            storageBucket: "farhanul-studio.firebasestorage.app",
            messagingSenderId: "720414517447",
            appId: "1:720414517447:web:698d6f69316e18992476e2",
            measurementId: "G-6BQWY0X13F"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let msnry;

        async function loadDesigns() {
            const grid = document.getElementById('portfolioGrid');
            const empty = document.getElementById('emptyState');
            
            try {
                const q = query(collection(db, "designs"), orderBy("order", "asc"));
                const snapshot = await getDocs(q);
                
                grid.innerHTML = '<div class="grid-sizer"></div>';

                if (snapshot.empty) {
                    empty.classList.add('show');
                    return;
                }

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const card = document.createElement('div');
                    card.className = 'portfolio-item';
                    card.setAttribute('data-category', data.category);
                    
                    const rawCover = data.coverUrl || (data.images && data.images.length > 0 ? data.images[0] : (data.imageUrl || 'https://via.placeholder.com/400'));
                    const coverImage = rawCover.replace('/upload/', '/upload/f_auto,q_auto/');

                    let tagsHTML = '';
                    if(data.tags) { 
                      const customTags = data.tags.split(',').map(t => t.trim());
                      customTags.forEach(t => {
                      if(t) tagsHTML += `<span class="tag">${t}</span>`;
                    });
                    }

                    card.innerHTML = `
                        <div class="portfolio-item-inner">
                            <img src="${rawCover}" class="portfolio-image" alt="${data.title}" loading="lazy">
                            <div class="portfolio-overlay">
                                <h3 class="portfolio-title">${data.title}</h3>
                                <p class="portfolio-category">${data.category}</p>
                                <div class="portfolio-tags">${tagsHTML}</div>
                            </div>
                        </div>
                    `;

                    card.onclick = (e) => {
                        if (window.innerWidth <= 768) {
                            if (!card.classList.contains('mobile-active')) {
                                document.querySelectorAll('.portfolio-item').forEach(item => {
                                    item.classList.remove('mobile-active');
                                });

                                card.classList.add('mobile-active');

                                return; 
                            }
                        }

                        // === KODINGAN BUKA MODAL (Jalan pas klik ke-2 di HP, atau klik biasa di Desktop) ===
                        document.getElementById('mTitle').textContent = data.title;
                        document.getElementById('mCategory').textContent = data.category.toUpperCase();
                        document.getElementById('mDesc').textContent = data.description || '-';
                        document.getElementById('mClient').textContent = data.client || '-';
                        document.getElementById('mTools').textContent = data.tools || '-';
                        document.getElementById('mYear').textContent = data.year || '-';
                        
                        const modalImageContainer = document.getElementById('modalImagesContainer');
                        modalImageContainer.innerHTML = '';

                        if(data.images && data.images.length > 0) {
                            data.images.forEach(imgUrl => {
                                if (imgUrl === data.coverUrl) return;
                                const imgTag = document.createElement('img');
                                imgTag.src = imgUrl.replace('/upload/', '/upload/f_auto,q_auto/');
                                imgTag.alt = data.title;
                                imgTag.loading = "lazy";
                                modalImageContainer.appendChild(imgTag);
                            });
                        } else if(data.imageUrl) {
                            const imgTag = document.createElement('img');
                            imgTag.src = data.imageUrl.replace('/upload/', '/upload/f_auto,q_auto/');
                            imgTag.alt = data.title;
                            modalImageContainer.appendChild(imgTag);
                        }

                        document.getElementById('portfolioModal').classList.add('active');
                    };

                    grid.appendChild(card);
                });

                msnry = new Masonry(grid, {
                    itemSelector: '.portfolio-item',
                    columnWidth: '.grid-sizer',
                    percentPosition: true
                });

                imagesLoaded(grid).on('progress', function() {
                    msnry.layout();
                });

                setupFilterButtons();

            } catch (err) {
                console.error("Gagal load:", err);
                grid.innerHTML = "<p style='color:red;'>Failed to load projects.</p>";
            }
        }

        function setupFilterButtons() {
            const filterBtns = document.querySelectorAll('.filter-btn');
            
            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const category = this.getAttribute('data-filter');
                    filterDesigns(category);
                });
            });
        }

        // Filter function
        function filterDesigns(category) {
            const items = document.querySelectorAll('.portfolio-item');
            const empty = document.getElementById('emptyState');
            let found = 0;
            
            items.forEach(item => {
                const itemCategory = item.getAttribute('data-category');
                
                if (category === 'all' || itemCategory === category) {
                    item.style.display = 'block';
                    found++;
                } else {
                    item.style.display = 'none';
                }
            });

            if(msnry) msnry.layout();
            
            if(found === 0) {
                empty.classList.add('show');
            } else {
                empty.classList.remove('show');
            }
        }

        window.closePortfolioModal = () => {
            document.getElementById('portfolioModal').classList.remove('active');
        };

        document.getElementById('portfolioModal').addEventListener('click', function(e) {
            if(e.target === this) {
                closePortfolioModal();
            }
        });

        loadDesigns();

        document.addEventListener('click', function(e) {
        if (!e.target.closest('.portfolio-item')) {
            document.querySelectorAll('.portfolio-item').forEach(item => {
                item.classList.remove('mobile-active');
            });
        }
    });
